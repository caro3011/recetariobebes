ego bajo con agua tapada 10-12 min.","Añade la pizca de canela al final, no al inicio.","Machaca hasta la textura deseada. No necesitas endulzar."],textura:{t1:"6-8m: Compota fina y homogénea, tibia no caliente.",t2:"9-10m: Con trocitos aplastables de 0.5cm.",t3:"11-12m: Cubos blandos para pinza, espolvoreados muy ligero de canela."},conservacion:{refri:"3 días refrigerada.",congel:"2 meses. Descongela en refri."},seguridad:{corte:"Trozos siempre blandos que se aplasten contra el paladar.",alergenos:"Canela Ceylan es más segura que Cassia. Usa mínima cantidad y solo desde 6m si pediatra autoriza.",nota:"Sin sal, sin azúcar. Canela nunca en rama entera."}},{id:3,seccion:"A",nombre:"Plátano asado con naranja",edad:"8m+",beneficio:"Energía de absorción lenta + vitamina C para mejorar absorción de hierro.",tiempo:"18 min",porciones:"3 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF4C",color:"#FFF0C8",ingredientes:["1 plátano maduro pero firme (150g / 1 unidad)","30ml jugo de naranja natural (2 cda)","1 cdta aceite de oliva suave (5ml)","1 pizca de canela Ceylan opcional"],pasos:["Precalienta horno a 180°C o sartén antiadherente.","Corta el plátano en mitades a lo largo, 6cm de largo.","Pincela con aceite y jugo de naranja. Asa 12 min hasta dorado suave.","Deja entibiar y corta según edad."],textura:{t1:"6-8m: No recomendado entero; si lo usas, puré del centro asado, sin trozos.",t2:"9-10m: Bastón grueso rebozado en avena fina para mejor agarre, blando por dentro.",t3:"11-12m: Rodajas gruesas de 1.5cm, fáciles para tenedor."},conservacion:{refri:"1 día. Se oscurece rápido.",congel:"No se recomienda congelar."},seguridad:{corte:"Forma de bastón del largo del puño del bebé para BLW, o media luna grande. Evita rodajas redondas pequeñas.",alergenos:"Naranja es alérgeno leve en algunos bebés. Ofrece poca cantidad primero.",nota:"Siempre tibio, nunca caliente. Observa si hay reacción a cítricos."}},{id:4,seccion:"A",nombre:"Papaya machacada con chía hidratada",edad:"8m+",beneficio:"Enzimas digestivas y omega-3 vegetal de la chía.",tiempo:"10 min + 10 min reposo",porciones:"2 porciones",dificultad:"Muy fácil",emoji:"\uD83E\uDDE1",color:"#FFE2C2",ingredientes:["200g papaya madura sin semillas (1 taza colmada)","1 cdta semillas de chía (5g)","30ml agua (2 cda) para hidratar","Jugo de 3 gotas de limón (opcional para que no se oxide)"],pasos:["Hidrata la chía en 30ml de agua 10 min hasta gel.","Machaca la papaya con tenedor hasta puré con grumos.","Mezcla con el gel de chía. Sirve fresco.","No licúes demasiado para mantener textura."],textura:{t1:"6-8m: Puré colado sin hebras largas.",t2:"9-10m: Machacado con gel bien mezclado, textura resbalosa controlada con chía.",t3:"11-12m: Cubos blandos de papaya con chía por encima."},conservacion:{refri:"24h máximo.",congel:"No congela bien la papaya."},seguridad:{corte:"Papaya siempre muy madura, sin hebras duras. Chía siempre hidratada, nunca seca.",alergenos:"Chía puede ser laxante si es mucha. Máx 1 cdta al día.",nota:"Introduce chía hidratada solo si ya tolera texturas."}},{id:5,seccion:"A",nombre:"Bastoncitos de mango maduro",edad:"6m+ BLW",beneficio:"Beta-carotenos y práctica de agarre palmar.",tiempo:"5 min",porciones:"3 bastones",dificultad:"Muy fácil",emoji:"\uD83E\uDD6D",color:"#FFE9B5",ingredientes:["1/2 mango Ataulfo o Tommy muy maduro (200g / 1 taza en tiras)","1 cda coco rallado fino sin azúcar para rebozar (6g) opcional","1 cdta avena molida para agarre (4g) opcional"],pasos:["Pela el mango con pelador.","Corta bastones gruesos del ancho de 2 dedos adultos y largo del puño del bebé.","Si resbala mucho, reboza ligeramente en coco o avena.","Sirve a temperatura ambiente."],textura:{t1:"6-8m: Bastón grande con hueso central si es seguro, que pueda chupar. Siempre maduro que se deshaga.",t2:"9-10m: Bastones con rebozado para agarre, blando.",t3:"11-12m: Cubos de 1.5cm con piel bien pelada para pinza."},conservacion:{refri:"1 día en tupper.",congel:"Se puede congelar en tiras 1 mes, textura ."],textura:{t1:"6-8m: Puré liso, sin fibras.",t2:"9-10m: Puré espeso con grumos muy blandos.",t3:"11-12m: Trozos blandos de 1cm, con un poco de puré."},conservacion:{refri:"3 días.",congel:"2 meses en porciones."},seguridad:{corte:"Zanahoria siempre muy blanda, nunca cruda en trozo. Cocida hasta que se aplaste fácil.",alergenos:"Bajo riesgo.",nota:"Sin sal. Si usas caldo, que sea casero sin sal."}},{id:8,seccion:"B",nombre:"Zapallo asado con aceite de oliva",edad:"6m+ BLW",beneficio:"Antioxidantes y dulzor natural aceptado fácilmente.",tiempo:"30 min",porciones:"5 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF83",color:"#FFE0B8",ingredientes:["400g zapallo o auyama sin cáscara (3 tazas en cubos/bastones)","1 cda aceite de oliva extra virgen (15ml)","1 pizca de orégano seco molido fino opcional (0.2g)"],pasos:["Corta zapallo en bastones de 6x2cm o cubos grandes.","Mezcla con aceite. Hornea a 190°C 25 min hasta blando.","Deja enfriar a tibio. Debe hundirse al presionar.","Sirve como bastón o machacado."],textura:{t1:"6-8m: Bastón muy blando que se deshace al chupar.",t2:"9-10m: Bastones con buen agarre, interior cremoso.",t3:"11-12m: Cubos de 1.5cm para pinza, ligeramente dorados."},conservacion:{refri:"3 días.",congel:"1 mes, aunque pierde un poco de firmeza."},seguridad:{corte:"Bastón largo, nunca cubo pequeño duro. Retira piel y semillas.",alergenos:"Orégano solo si ya tolera hierbas.",nota:"Asado sin sal. El dulzor natural es suficiente."}},{id:9,seccion:"B",nombre:"Brócoli al vapor con limón (bastoncitos)",edad:"6m+ BLW",beneficio:"Hierro vegetal, fibra y vitamina C.",tiempo:"12 min",porciones:"3 porciones",dificultad:"Muy fácil",emoji:"\uD83E\uDD66",color:"#D9E8D0",ingredientes:["200g brócoli en arbolitos medianos con tallo (2 tazas)","500ml agua para vapor","3 gotas de limón","1 cdta aceite de oliva (5ml)"],pasos:["Lava bien el brócoli. Deja tallo largo de 4-5cm para agarre.","Vaporiza 8-10 min hasta que tallo esté tierno y se clave tenedor sin resistencia.","Rocía gotas de limón y aceite.","Sirve tibio, no caliente."],textura:{t1:"6-8m: Arbolito grande con tallo blando, chupa la flor.",t2:"9-10m: Flores pequeñas sueltas muy blandas.",t3:"11-12m: Picado fino de 0.5cm mezclado con papa o arroz."},conservacion:{refri:"2 días.",congel:"1 mes, mejor en puré."},seguridad:{corte:"Tallo siempre blando, nunca fibroso. Tamaño mayor que la boca del bebé. Evita trozos sueltos pequeños que se desprendan duros.",alergenos:"Puede causar gases. Ofrece porción pequeña primero.",nota:"Cocción completa es clave para seguridad."}},{id:10,seccion:"B",nombre:"Puré de arvejas y menta",edad:"7m+",beneficio:"Proteína vegetal + frescura que ayuda a aceptar legumbres.",tiempo:"15 min",porciones:"4 porciones",dificultad:"Fácil",emoji:"\uD83D\uDFE2",color:"#D6E8C9",ingredientes:["150g arvejas frescas o congeladas sin sal (1 taza)","1 papa pequeña (80g)","1 hoja pequeña de menta fresca (0.5g)","1 cdta aceite de oliva (5ml)"],pasos:["Cocina arvejas y papa en agua sin sal 12 min.","Añade menta al final 30 seg.","Licúa con un poco de agua hasta puré. Pasa por colador si hay pieles.","Añade aceite."],textura:{t1:"6-8m: Puré fino pasado por colador, sin hollejos.",t2:"9-10m: Puré con algo de textura, sin colar si tolera.",t3:"11-12m: Arvejas aplastadas con tenedor, no enteras."},conservacion:{refri:"2 días.",congel:"2 meses."},seguridad:{corte:"Nunca arvejas enteras redondas para <12m sin aplastar. Siempre aplastadas.",alergenos:"Menta en mínima cantidad.",nota:"Arveja entera es riesgo de atragantamiento. Aplasta siempre."}},{id:11,seccion:"B",nombre:"Bastoncitos de yuca dorada suave",edad:"8m+",beneficio:"Energía densa y textura que entrena masticación.",tiempo:"35 min",porciones:"4 porciones",dificultad:"Media",emoji:"\uD83C\uDF60",color:"#F1E6D0",ingredientes:["300g yuca fresca pelada sin vena central (2 tazas en bastones)","1 litro agua para cocción","1 cda aceite de oliva (15ml)","1 pizca de ajo en polvo opcional (0.2g)"],pasos:["Pela bien la yuca, retira vena leñosa central.","Hierve 20 min hasta muy blanda.","Corta en bastones y dora suave en sartén con aceite 5 min, sin freír profundo.","Deben quedar dorados por fuera, muy blandos dentro."],textura:{t1:"6-8m: Solo el interior muy blando machacado como puré.",t2:"9-10m: Bastón grueso ultra blando, sin partes duras.",t3:"11-12m: Bastones de 5cm, blandos, fáciles de tomar."},conservacion:{refri:"2 días.",congel:"No congela bien."},seguridad:{corte:"Yuca siempre muy cocida, nunca al dente. Retira fibras duras. Bastón grueso, no palitos delgados duros.",alergenos:"Bajo riesgo.",nota:"Yuca cruda es tóxica. Cocción completa obligatoria."}},{id:12,seccion:"B",nombre:"Crema de ahuyama y puerro",edad:"7m+",beneficio:"Prebióticos del puerro y betacarotenos.",tiempo:"25 min",porciones:"5 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF72",color:"#FFE4B5",ingredientes:["300g ahuyama en cubos (2 tazas)","40g parte blanca de puerro lavado (1/4 taza picado fino)","200ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Sofríe puerro 2 min con aceite sin dorar, solo sudar.","Añade ahuyama y agua. Cocina 18 min.","Licúa hasta crema espesa y lisa.","Sirve tibia."],textura:{t1:"6-8m: Crema lisa y fluida.",t2:"9-10m: Crema espesa, con cuchara que no gotee.",t3:"11-12m: Con trocitos de ahuyama muy blandos de 0.8cm."},conservacion:{refri:"3 días.",congel:"2 meses."},seguridad:{corte:"Si lleva trozos, siempre blandos.",alergenos:"Puerro es de la familia cebolla, puede dar gases. Introduce poco.",nota:"Sin sal, sin caldo industrial."}},{id:13,seccion:"B",nombre:"Batata asada en bastones",edad:"6m+ BLW",beneficio:"Vitamina A en alta cantidad y fibra dulce.",tiempo:"30 min",porciones:"4 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF60",color:"#FBD9C0",ingredientes:["2 batatas medianas (350g / 2 tazas en bastones)","1 cda aceite de oliva (15ml)","1 pizca de canela Ceylan opcional"],pasos:["Pela batata, corta bastones de 6x1.5cm.","Mezcla con aceite. Hornea 25 min a 200°C hasta tierna.","Debe aplastarse entre dedos índice y pulgar.","Sirve tibia."],textura:{t1:"6-8m: Bastón grande muy blando.",t2:"9-10m: Bastones con interior cremoso.",t3:"11-12m: Cubos para pinza, 1.2cm."},conservacion:{refri:"3 días.",congel:"1 mes."},seguridad:{corte:"Evita puntas delgadas duras. Todo el bastón blando.",alergenos:"Bajo riesgo.",nota:"No añadir azúcar, la batata ya es dulce."}},{id:14,seccion:"B",nombre:"Calabacín salteado en tiras blandas",edad:"7m+",beneficio:"Hidratación y potasio, muy digestivo.",tiempo:"10 min",porciones:"3 porciones",dificultad:"Muy fácil",emoji:"\uD83E\uDD52",color:"#DDEBD5",ingredientes:["1 calabacín mediano (200g / 1 1/2 taza en tiras)","1 cdta aceite de oliva (5ml)","1 cda agua (15ml)"],pasos:["Corta calabacín en tiras de 5cm x 1cm, con piel si es orgánico tierno.","Saltea con aceite y agua 5-6 min tapado hasta blando.","No debe quedar crocante.","Sirve tibio."],textura:{t1:"6-8m: Tiras muy blandas, casi puré, o puré.",t2:"9-10m: Tiras blandas que se doblan sin romperse.",t3:"11-12m: Tiras de 3cm, para pinza."},conservacion:{refri:"2 días.",congel:"No recomendado, suelta agua."},seguridad:{corte:"Tiras anchas, nunca rodajas redondas delgadas crudas. Siempre cocido blando.",alergenos:"Bajo riesgo.",nota:"Cocina siempre bien, calabacín crudo no es seguro en tiras para bebés."}},{id:15,seccion:"C",nombre:"Yema de huevo revuelta suave + aguacate",edad:"6m+",beneficio:"Colina para cerebro y hierro biodisponible.",tiempo:"8 min",porciones:"2 porciones",dificultad:"Fácil",emoji:"\uD83E\uDD5A",color:"#FFF2C2",ingredientes:["2 yemas de huevo (sin clara para inicio, 30g)","30g aguacate maduro (2 cda)","1 cdta aceite de oliva (5ml)","15ml agua (1 cda)"],pasos:["Bate yemas con agua.","En sartén antiadherente a fuego muy bajo, revuelve suave con aceite hasta cuajado cremoso, no seco.","Mezcla con aguacate machacado.","Sirve tibio, textura untuosa."],textura:{t1:"6-8m: Revuelto casi crema, sin grumos secos.",t2:"9-10m: Revuelto suave picadito fino con aguacate.",t3:"11-12m: Trozos pequeños de 0.5cm mezclados."},conservacion:{refri:"1 día.",congel:"No congelar huevo revuelto."},seguridad:{corte:"Huevo siempre bien cocido. Yema no líquida. Si BLW, tiras de tortilla bien cocida blandas.",alergenos:"Huevo es alérgeno mayor. Introduce yema primero, observa 3 días. Luego huevo entero bien cocido.",nota:"Sin sal. Cocina a >70°C."}},{id:16,seccion:"C",nombre:"Huevo duro machacado con aceite de oliva",edad:"6m+",beneficio:"Proteína completa y grasas para saciedad.",tiempo:"12 min",porciones:"2 porciones",dificultad:"Muy fácil",emoji:"\uD83E\uDD5A",color:"#FEF0B8",ingredientes:["1 huevo grande (60g)","1 cdta aceite de oliva extra virgen (5ml)","15ml agua o leche materna (1 cda)"],pasos:["Hierve huevo 11 min desde agua hirviendo.","Enfría en agua, pela.","Machaca yema y clara muy fina con aceite y agua hasta pasta.","Sirve tibio o a temperatura ambiente."],textura:{t1:"6-8m: Pasta fina, casi puré, sin trozos de clara elástica.",t2:"9-10m: Picado muy fino, húmedo.",t3:"11-12m: Picado de 0.3cm, no seco."},conservacion:{refri:"1 día pelado.",congel:"No."},seguridad:{corte:"Clara puede ser elástica: machacar muy fino. Nunca huevo entero redondo.",alergenos:"Alérgeno mayor. Introduce con regla de 3 días.",nota:"Si hay antecedentes familiares de alergia, consulta pediatra antes."}},{id:17,seccion:"C",nombre:"Pollo desmechado jugoso en su jugo",edad:"7m+",beneficio:"Hierro hemo y zinc para crecimiento.",tiempo:"35 min",porciones:"6 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF57",color:"#F5E2C8",ingredientes:["300g pechuga o muslo sin piel sin hueso (2 piezas)","400ml agua","1 trozo pequeño de zanahoria (30g) y puerro para aroma","1 cdta aceite de oliva (5ml)"],pasos:["Cocina pollo en agua con verduras 25-30 min a fuego bajo, sin sal.","Retira y desmecha muy fino, casi hilachas de 1cm, contra la fibra.","Mezcla con 2-3 cda de su caldo para que quede jugoso.","Sirve tibio, nunca seco."],textura:{t1:"6-8m: Puré de pollo: licúa desmechado con caldo hasta puré liso.",t2:"9-10m: Desmechado muy fino y jugoso, hilachas cortas de 1cm.",t3:"11-12m: Desmechado de 1.5cm, fácil de tomar con pinza."},conservacion:{refri:"2 días.",congel:"2 meses en porciones con caldo."},seguridad:{corte:"Nunca trozos grandes secos o cubos duros. Desmechado fino y húmedo es seguro. Evita que se haga bola seca.",alergenos:"Bajo riesgo.",nota:"Sin sal, sin condimentos picantes. Jugoso siempre."}},{id:18,seccion:"C",nombre:"Puré de lentejas rojas y zanahoria",edad:"7m+",beneficio:"Hierro + fibra soluble que no inflama tanto.",tiempo:"20 min",porciones:"5 porciones",dificultad:"Fácil",emoji:"\uD83E\uDED8",color:"#F3DCC2",ingredientes:["80g lentejas rojas secas (1/3 taza)","1 zanahoria pequeña (80g / 1/2 taza picada)","400ml agua","1 cdta aceite de oliva (5ml)","1 hoja laurel pequeña (retirar al final)"],pasos:["Lava lentejas. No requieren remojo largo, pero enjuaga.","Cocina con zanahoria, agua y laurel 15-18 min hasta deshechas.","Retira laurel, tritura con aceite.","Debe quedar cremoso, sin pieles duras."],textura:{t1:"6-8m: Puré fino colado si hay pieles.",t2:"9-10m: Puré espeso con textura.",t3:"11-12m: Lentejas aplastadas, no enteras."},conservacion:{refri:"3 días.",congel:"3 meses."},seguridad:{corte:"Lenteja siempre muy cocida y aplastada, nunca entera redonda para <12m sin aplastar.",alergenos:"Legumbre: introduce poco, observa gases.",nota:"Lenteja roja es más digestiva que verde."}},{id:19,seccion:"C",nombre:"Albóndigas blandas de pavo y zanahoria (sin sal)",edad:"8m+",beneficio:"Proteína magra y práctica de pinza y mordida.",tiempo:"25 min",porciones:"10 mini albóndigas",dificultad:"Media",emoji:"\uD83C\uDF56",color:"#F2DDD0",ingredientes:["200g carne molida de pavo (1 taza)","50g zanahoria rallada fina (1/3 taza)","20g avena molida fina (2 cda)","30ml agua (2 cda)","1 cdta aceite de oliva (5ml)"],pasos:["Mezcla pavo, zanahoria, avena y agua. Amasa suave.","Forma bolitas de 2cm, aplasta ligeramente.","Hornea 18 min a 180°C o cocina al vapor 15 min hasta interior 74°C.","Deben quedar jugosas, no secas."],textura:{t1:"6-8m: No en bola entera; desmenuzada muy fina y húmeda.",t2:"9-10m: Media albóndiga blanda cortada en tiras, muy jugosa.",t3:"11-12m: Albóndiga pequeña cortada en cuartos a lo largo, no en rodajas redondas."},conservacion:{refri:"2 días.",congel:"2 meses cocidas."},seguridad:{corte:"Corte seguro: nunca bola entera redonda. Corta en cuartos a lo largo, forma de media luna. Debe deshacerse fácil con encías.",alergenos:"Pavo bajo riesgo. Avena puede contener gluten.",nota:"Sin sal. Jugosa siempre, si está seca, añade caldo."}},{id:20,seccion:"C",nombre:"Pescado blanco al vapor con papa",edad:"8m+",beneficio:"Omega y proteína de fácil digestión.",tiempo:"18 min",porciones:"3 porciones",dificultad:"Fácil",emoji:"\uD83D\uDC1F",color:"#E2EADF",ingredientes:["150g filete de pescado blanco sin espinas (merluza, tilapia 1 filete)","100g papa en cubos (2/3 taza)","1 cdta aceite de oliva (5ml)","2 gotas limón"],pasos:["Cocina papa al vapor 12 min.","Añade pescado encima 6-8 min más hasta que se deshaga en láminas.","Revisa con dedos que no haya espinas.","Machaca papa y desmenuza pescado fino, mezcla con aceite."],textura:{t1:"6-8m: Puré de papa con pescado licuado fino.",t2:"9-10m: Papa machacada con pescado en láminas muy pequeñas húmedas.",t3:"11-12m: Trozos de 1cm de pescado jugoso y papa."},conservacion:{refri:"1 día.",congel:"1 mes, textura cambia."},seguridad:{corte:"Desmenuzar siempre revisando espinas con yema de dedos. Nunca trozo grande fibroso.",alergenos:"Pescado es alérgeno mayor. Introduce blanco primero, poca cantidad, 3 días.",nota:"Elige pescado bajo en mercurio. Evita atún, pez espada."}},{id:21,seccion:"C",nombre:"Puré de garbanzos y tahini suave (hummus bebé)",edad:"8m+",beneficio:"Hierro, calcio y grasas de ajonjolí.",tiempo:"10 min (con garbanzo cocido)",porciones:"4 porciones",dificultad:"Fácil",emoji:"\uD83E\uDDC6",color:"#EDE0C5",ingredientes:["150g garbanzos cocidos sin sal (3/4 taza)","1 cdta tahini suave (5g / pasta de ajonjolí)","1 cdta aceite de oliva (5ml)","30-50ml agua de cocción","2 gotas limón"],pasos:["Si usas garbanzo seco, remoja 8h y cocina 40 min hasta muy blando. Mejor sin piel.","Licúa garbanzos con tahini, aceite, agua y limón hasta crema lisa.","Si quedan pieles, cuela.","Sirve tibio como dip."],textura:{t1:"6-8m: Crema muy lisa, untada fina.",t2:"9-10m: Crema espesa para dipear bastón blando.",t3:"11-12m: Pasta espesa, con bastones de verdura."},conservacion:{refri:"3 días.",congel:"2 meses."},seguridad:{corte:"Garbanzo entero nunca. Siempre puré o muy aplastado.",alergenos:"Ajonjolí (tahini) es alérgeno mayor. Introduce en mínima cantidad, observa.",nota:"Tahini suave, no tostado intenso."}},{id:22,seccion:"C",nombre:"Carne de res guisada extra blanda",edad:"8m+",beneficio:"Hierro hemo altamente biodisponible.",tiempo:"60 min",porciones:"6 porciones",dificultad:"Media",emoji:"\uD83E\uDD69",color:"#E8D0BE",ingredientes:["300g carne de res magra para guisar en trozos pequeños (1 1/2 taza)","1 zanahoria pequeña (60g)","30g cebolla blanca (2 cda picada fina)","400ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Sofríe cebolla 2 min con aceite sin dorar mucho.","Añade carne y sella ligero.","Añade agua y zanahoria, cocina tapado a fuego muy bajo 45-50 min hasta que se deshaga.","Desmecha fino o licúa con caldo para puré."],textura:{t1:"6-8m: Puré de carne: licúa con caldo hasta fino.",t2:"9-10m: Carne desmechada ultra fina, jugosa, de 1cm.",t3:"11-12m: Hilachas de 1.5cm muy blandas, mezcladas con verdura."},conservacion:{refri:"2 días.",congel:"2 meses."},seguridad:{corte:"Nunca trozo grande seco. Siempre húmedo, desmechado fino. Evita trozos elásticos.",alergenos:"Bajo riesgo.",nota:"Sin sal. Cocción larga es seguridad."}},{id:23,seccion:"D",nombre:"Puré completo de pollo, papa y zanahoria",edad:"7m+",beneficio:"Plato completo: proteína + carbo + verdura en una cuchara.",tiempo:"30 min",porciones:"5 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF5B",color:"#F0E2C8",ingredientes:["150g muslo de pollo sin piel (3/4 taza en cubos)","1 papa mediana (150g / 1 taza cubos)","1 zanahoria mediana (100g / 2/3 taza)","300ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Cocina todo junto en agua sin sal 25 min hasta muy blando.","Reserva caldo.","Tritura con aceite ajustando con caldo.","Debe quedar cremoso, homogéneo."],textura:{t1:"6-8m: Puré liso.",t2:"9-10m: Puré con grumos blandos de 0.5cm.",t3:"11-12m: Trozos de 1cm mezclados, para tenedor."},conservacion:{refri:"2 días.",congel:"2 meses."},seguridad:{corte:"Si en trozos, pollo siempre desmechado fino, verduras blandas.",alergenos:"Bajo riesgo.",nota:"Plato equilibrado ideal para mediodía."}},{id:24,seccion:"D",nombre:"Lentejas con arroz y calabacín",edad:"8m+",beneficio:"Combinación proteína completa vegetal + hierro.",tiempo:"30 min",porciones:"5 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF5A",color:"#E7E0C2",ingredientes:["50g lentejas rojas (1/4 taza)","40g arroz blanco (3 cda)","80g calabacín en cubos (1/2 taza)","400ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Lava lentejas y arroz.","Cocina todo junto 20 min hasta arroz muy blando y lenteja deshecha.","Añade aceite y machaca ligeramente.","Sirve tibio, no seco."],textura:{t1:"6-8m: Puré semi-liso.",t2:"9-10m: Arroz pasado y lenteja aplastada.",t3:"11-12m: Arroz blando con lenteja aplastada, trozos calabacín 0.8cm."},conservacion:{refri:"3 días.",congel:"2 meses."},seguridad:{corte:"Lenteja siempre aplastada, arroz muy cocido pegajoso, no suelto duro.",alergenos:"Bajo riesgo.",nota:"Ideal para mejorar aceptación de legumbres."}},{id:25,seccion:"D",nombre:"Quinua con zapallo y pollo",edad:"8m+",beneficio:"Quinua aporta aminoácidos esenciales + fibra.",tiempo:"25 min",porciones:"4 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF3E",color:"#EDE4B8",ingredientes:["40g quinua lavada (3 cda)","150g zapallo en cubos (1 taza)","100g pollo en cubitos pequeños (1/2 taza)","250ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Lava quinua muy bien 2 veces para quitar saponina.","Cocina quinua con zapallo y pollo 18 min hasta quinua abierta y pollo cocido.","Machaca zapallo y desmecha pollo.","Mezcla con aceite."],textura:{t1:"6-8m: Puré de quinua bien cocida, colada si es necesario.",t2:"9-10m: Quinua blanda con zapallo machacado y pollo fino.",t3:"11-12m: Grano entero blando mezclado."},conservacion:{refri:"2 días.",congel:"1 mes."},seguridad:{corte:"Quinua bien cocida, nunca al dente. Pollo desmechado fino.",alergenos:"Quinua puede dar gases, introduce poco.",nota:"Lavar quinua es clave para quitar amargor."}},{id:26,seccion:"D",nombre:"Sopa espesa de verduras y carne",edad:"8m+",beneficio:"Caldo nutritivo y exposición a varios sabores en uno.",tiempo:"50 min",porciones:"6 porciones",dificultad:"Media",emoji:"\uD83C\uDF72",color:"#DDD8C5",ingredientes:["200g carne de res para guisar en cubos pequeños (1 taza)","1 zanahoria (80g)","1 papa (100g)","40g habichuela tierna picada fina (1/4 taza)","500ml agua","1 cdta aceite de oliva (5ml)"],pasos:["Sofríe carne 2 min con aceite.","Añade agua y cocina 30 min a fuego bajo.","Añade verduras en cubos pequeños, cocina 15 min más hasta todo muy blando.","Sirve espesa, no aguada. Tritura parcialmente según edad."],textura:{t1:"6-8m: Todo licuado hasta crema espesa.",t2:"9-10m: Caldo espeso con verduras machacadas y carne desmechada fina.",t3:"11-12m: Trozos blandos de 0.8-1cm en caldo espeso."},conservacion:{refri:"2 días.",congel:"2 meses."},seguridad:{corte:"Habichuela y zanahoria siempre muy blanda, nunca al dente. Carne desmechada fina.",alergenos:"Bajo riesgo.",nota:"Sin sal, sin cubo de caldo. Espesa para que no se atragante con líquido fino."}},{id:27,seccion:"D",nombre:"Arroz con huevo y brócoli picadito",edad:"8m+",beneficio:"Plato rápido completo para noches sin complicaciones.",tiempo:"20 min",porciones:"3 porciones",dificultad:"Fácil",emoji:"\uD83E\uDD66",color:"#DDE6C8",ingredientes:["60g arroz blanco cocido muy blando (1/2 taza cocido)","1 huevo (60g)","60g brócoli cocido picado fino (1/3 taza)","1 cdta aceite de oliva (5ml)"],pasos:["Cocina arroz pasado, que quede pegajoso.","Cocina brócoli al vapor 8 min, pica fino de 0.3cm.","Haz huevo revuelto suave a fuego bajo, sin secar.","Mezcla todo con aceite."],textura:{t1:"6-8m: Arroz pasado licuado con brócoli y huevo en puré.",t2:"9-10m: Arroz muy blando machacado con huevo húmedo y brócoli picado fino.",t3:"11-12m: Bolitas pequeñas de arroz pegajoso con huevo y brócoli."},conservacion:{refri:"1 día (huevo).",congel:"No."},seguridad:{corte:"Brócoli muy blando, huevo húmedo no seco, arroz pegajoso no suelto.",alergenos:"Huevo alérgeno mayor.",nota:"Revuelto jugoso, nunca seco."}},{id:28,seccion:"D",nombre:"Pasta pequeña con salsa de tomate casera y carne",edad:"9m+",beneficio:"Hierro + licopeno del tomate + energía de la pasta.",tiempo:"25 min",porciones:"4 porciones",dificultad:"Fácil",emoji:"\uD83C\uDF5D",color:"#F5D5C0",ingredientes:["60g pasta pequeña tipo estrellitas o conchitas (1/3 taza seca)","100g tomate maduro sin piel ni semillas (1/2 taza)","80g carne molida magra (1/3 taza)","1 cdta aceite de oliva (5ml)","20g cebolla blanca picada fina (1 cda)"],pasos:["Cocina pasta muy blanda, 2 min más que el paquete, en agua sin sal.","Sofríe cebolla 2 min, añade carne, cocina 5 min.","Añade tomate picado sin piel, cocina 10 min hasta salsa espesa.","Mezcla pasta con salsa, pica más si es necesario."],textura:{t1:"6-8m: No recomendado con trozos de carne; usa solo salsa de tomate licuada con pasta pasada.",t2:"9-10m: Pasta muy blanda cortada, salsa espesa con carne picada muy fina.",t3:"11-12m: Pasta pequeña entera blanda con salsa."},conservacion:{refri:"2 días.",congel:"1 mes sin pasta (pasta fresca al momento)."},seguridad:{corte:"Pasta pequeña muy blanda, nunca al dente. Tomate sin piel. Carne molida muy fina, no en bola.",alergenos:"Gluten (pasta) y tomate puede irritar.",no
